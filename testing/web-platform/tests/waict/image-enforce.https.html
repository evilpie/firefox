<!doctype html>
<meta charset="utf-8">
<title>WAICT: Image tests with enforce mode</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/reporting/resources/report-helper.js"></script>
<body>
<script>
  // Currently supported test scenarios:
  // 1. Image with correct hash present in the manifest in the hashes section
  // 2. Image with incorrect hash present in the manifest in the hashes section
  // 3. Image with hash present in the manifest in the any_hashes section
  // 4. Image with incorrect hash in the any_hashes section
  // 5. Image not present in the manifest at all

  // Helper function to set up ReportingObserver for integrity violations
  function setupIntegrityViolationObserver(t) {
    const reports = [];
    const observer = new ReportingObserver((reportList) => {
      reports.push(...reportList);
    }, {types: ['integrity-violation']});
    observer.observe();
    t.add_cleanup(() => observer.disconnect());
    return reports;
  }

  // Test 1: Image with a correct hash in manifest (hashes section):

  // Check that:                                                      
  // - Image loads successfully                                                      
  // - No integrity violation reports generated  
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    const loadPromise = new Promise((resolve, reject) => {
      img.onload = () => resolve();
      img.onerror = () => reject(new Error('Image failed to load'));
    });

    document.body.appendChild(img);
    img.src = 'resources/correct.png';

    await loadPromise;
    assert_true(img.complete, 'Image should load successfully when hash matches');

    // Wait a bit to ensure no reports are generated
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // Verify NO integrity violation reports were generated
    assert_equals(reports.length, 0, 'Should not generate any integrity violation reports for correct hash');
  }, 'Image with correct hash should load without generating reports (enforce mode)');

  // Test 2: Image with an incorrect hash in manifest (hashes section):
  
  // Check that:                                                      
  // - Image loading failed                                                      
  // - Integrity violation report is generated with the correct error. 
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    let imageResult = null; // 'loaded' or 'failed'

    // Wrong hash - image should fail loading
    // AW: In audit and above we have a different promise:
    // according to that logic img.onload = () => will reject the promise
    // But as I had problems with the reporting api we resolve everything
    const imagePromise = new Promise((resolve) => {
      img.onload = () => {
        imageResult = 'loaded';
        resolve();
      };
      img.onerror = () => {
        imageResult = 'failed';
        resolve();
      };
    });

    document.body.appendChild(img);
    img.src = 'resources/incorrect.png';

    await imagePromise;

    // Wait a bit for reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // In enforce mode, image should be blocked
    assert_equals(imageResult, 'failed', 'Image should be blocked in enforce mode when hash does not match');

    // Check integrity violation reports (when implemented)
    if (reports.length > 0) {
      const report = reports[0];
      assert_equals(report.type, 'integrity-violation', 'Report type should be integrity-violation');
      assert_true(report.body.blockedURL.includes('red-panda.webp'), 'Report should reference the blocked image');
      assert_false(report.body.reportOnly || false, 'Report should not be report-only in enforce mode');
    }
  }, 'Image with wrong hash should fail to load and generate hash mismatch error (enforce mode)');


  // Test 3: Image with a correct hash in manifest (wildcard section):
  // Check that:
  // - Image loads successfully when hash is in any_hashes (even if path not in hashes)
  // - No integrity violation reports generated
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    const loadPromise = new Promise((resolve, reject) => {
      img.onload = () => resolve();
      img.onerror = () => reject(new Error('Image failed to load'));
    });

    document.body.appendChild(img);
    img.src = 'resources/correct_wildcards.png';

    await loadPromise;
    assert_true(img.complete, 'Image should load successfully when hash is in any_hashes');

    // Wait a bit to ensure no reports are generated
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // Verify NO integrity violation reports were generated
    assert_equals(reports.length, 0, 'Should not generate any integrity violation reports for hash in any_hashes');
  }, 'Image with hash in any_hashes should load successfully (enforce mode)');

  // Test 4: Image with a incorrect hash in manifest (wildcard section):

  // Check that:
  // - Image fails to load (wrong hash in any_hashes)
  // - Integrity violation report is generated
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    let imageResult = null;

    const imagePromise = new Promise((resolve) => {
      img.onload = () => {
        imageResult = 'loaded';
        resolve();
      };
      img.onerror = () => {
        imageResult = 'failed';
        resolve();
      };
    });

    document.body.appendChild(img);
    img.src = 'resources/incorrect_wildcards.png';

    await imagePromise;

    // Wait a bit for reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // In enforce mode, image should be blocked
    assert_equals(imageResult, 'failed', 'Image should be blocked when hash in any_hashes does not match');

    // Check integrity violation reports (when implemented)
    if (reports.length > 0) {
      const report = reports[0];
      assert_equals(report.type, 'integrity-violation', 'Report type should be integrity-violation');
      assert_true(report.body.blockedURL.includes('incorrect_wildcards.png'), 'Report should reference the blocked image');
      assert_false(report.body.reportOnly || false, 'Report should not be report-only in enforce mode');
    }
  }, 'Image with wrong hash in any_hashes should fail to load (enforce mode)');

  // Test 5: Image not in manifest at all
  // Check that:
  // - Image fails to load (not in manifest)
  // - Integrity violation report is generated
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    let imageResult = null;

    const imagePromise = new Promise((resolve) => {
      img.onload = () => {
        imageResult = 'loaded';
        resolve();
      };
      img.onerror = () => {
        imageResult = 'failed';
        resolve();
      };
    });

    document.body.appendChild(img);
    img.src = 'resources/no_hash.png';

    await imagePromise;

    // Wait a bit for reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // In enforce mode, image should be blocked
    assert_equals(imageResult, 'failed', 'Image should be blocked when not in manifest');

    // Check integrity violation reports (when implemented)
    if (reports.length > 0) {
      const report = reports[0];
      assert_equals(report.type, 'integrity-violation', 'Report type should be integrity-violation');
      assert_true(report.body.blockedURL.includes('no_hash.png'), 'Report should reference the blocked image');
      assert_false(report.body.reportOnly || false, 'Report should not be report-only in enforce mode');
    }
  }, 'Image not in manifest should fail to load (enforce mode)');
</script>
</body>
