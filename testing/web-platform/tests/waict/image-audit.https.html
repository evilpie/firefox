<!doctype html>
<meta charset="utf-8">
<title>WAICT: Image tests with audit mode</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<script src="/reporting/resources/report-helper.js"></script>
<body>
<script>
  // Helper function to set up ReportingObserver for integrity violations
  function setupIntegrityViolationObserver(t) {
    const reports = [];
    const observer = new ReportingObserver((reportList) => {
      reports.push(...reportList);
    }, {types: ['integrity-violation']});
    observer.observe();
    t.add_cleanup(() => observer.disconnect());
    return reports;
  }

  // Test correct image hash behavior:    
  // Check that:                                                      
  // - Image loads successfully                                                      
  // - No integrity violation reports generated  
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    const loadPromise = new Promise((resolve, reject) => {
      img.onload = () => resolve();
      img.onerror = () => reject(new Error('Image failed to load'));
    });

    document.body.appendChild(img);
    img.src = 'resources/red-panda.webp';

    await loadPromise;
    assert_true(img.complete, 'Image should load successfully when hash matches');

    // Wait a bit to ensure no reports are generated
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // Verify NO integrity violation reports were generated
    assert_equals(reports.length, 0, 'Should not generate any integrity violation reports for correct hash');
  }, 'Image with correct hash should load without generating reports (audit mode)');


  // In this test case we are trying to load an image. The image has an incorrect hash in the manifest
  
  // Test incorrect image hash behavior:
  // Check that:
  // - Image loads successfully (audit mode doesn't block)
  // - Integrity violation report is generated

  // AW: the last one does not work, have I screwed up smth in the test? :(
  promise_test(async t => {
    const reports = setupIntegrityViolationObserver(t);

    const img = document.createElement('img');
    let imageResult = null; // 'loaded' or 'failed'

    // Ok, this should be the same as above, but it's rn like here for testing purposes
    // P.S. Maybe we resolve in all the cases? Just check the flag?
    const loadPromise = new Promise((resolve) => {
      img.onload = () => {
        imageResult = 'loaded';
        resolve();
      };
      img.onerror = () => {
        imageResult = 'failed';
        resolve();
      };
    });

    document.body.appendChild(img);
    img.src = 'resources/red-panda.webp?test=wrongHash';

    await loadPromise;

    // Wait a bit for reports
    await new Promise(resolve => t.step_timeout(resolve, 100));

    // In audit mode, image SHOULD load even with wrong hash
    assert_equals(imageResult, 'loaded', 'Image should load in audit mode even with wrong hash');

    // Check integrity violation reports
    // AW: This does not work for now, I think I can not catch ReportToConsole as well? 
    if (reports.length > 0) {
      const report = reports[0];
      assert_equals(report.type, 'integrity-violation', 'Report type should be integrity-violation');
      assert_true(report.body.blockedURL.includes('red-panda.webp'), 'Report should reference the image');
      assert_equals(report.body.reportOnly, true, 'Report should indicate this is report-only mode');
    }
  }, 'Image with wrong hash should still load but generate hash mismatch error (audit mode)');
</script>
</body>
