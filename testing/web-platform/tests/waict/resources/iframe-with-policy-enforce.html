<!doctype html>
<body>
<div id="status">Script not executed</div>
</body>
<script>
// Iframe with WAICT policy applied in enforce mode
// I am not sure that we must have 2 iframe implementations for 2 different modes
// I believe that the code would search for the header name that corresponds to the file name
// So probably we must have these 2 files

window.addEventListener('message', function(event) {
  if (event.data.action === 'loadScript') {
    window.ran = false;

    const script = document.createElement('script');
    script.onload = function() {
      event.source.postMessage({
        type: 'scriptResult',
        loaded: true,
        ran: window.ran
      }, '*');
    };
    script.onerror = function() {
      event.source.postMessage({
        type: 'scriptResult',
        loaded: false,
        ran: window.ran
      }, '*');
    };
    script.src = event.data.src;
    document.body.appendChild(script);
  }
});

if (window.parent !== window) {
  window.parent.postMessage({type: 'ready'}, '*');
}
</script>
